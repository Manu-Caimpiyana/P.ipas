<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Keuangan - SIKasir</title>
    <link rel="stylesheet" href="assets/style/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Mengecilkan kolom minimal */
            gap: 20px;
            margin-top: 20px;
        }
        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 400px;
        }
        .btn-back {
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            margin-left: 1.5%;
            transition: linear 150ms';
        }
        .btn-back:hover { background-color: #06318fe1; }
        .insight-box {
            background: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="main">
    <div class="navbar">
        <h1>Dashboard analisis Keuangan</h1>
    </div>

    <div style="padding: 20px;">
        
        <div class="cards">
            <div class="card">
                <h3>Total Omset</h3>
                <p id="analitikOmset">Rp 0</p>
            </div>
            <div class="card">
                <h3>Total Produk Terjual</h3>
                <p id="analitikTerjual">0 pcs</p>
            </div>
            <div class="card">
                <h3>Rata-rata per Transaksi</h3>
                <p id="analitikRerata">Rp 0</p>
            </div>
        </div>

        <div class="analytics-grid">
            <div class="chart-box">
                <h2>Produk Yang Terjual</h2>
                <canvas id="chartProduk"></canvas>
            </div>

            <div class="chart-box">
                <h2>Pendapatan per Kategori</h2>
                <canvas id="chartKategori"></canvas>
            </div>
        </div>
    </div>
    <a href="program.html" class="btn-back">← Kembali ke Kasir</a>
</div>



<script src="assets/script/analytics.js"></script>
</body>
</html>
